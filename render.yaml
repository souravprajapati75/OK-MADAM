# Render Blueprint Specification
# https://render.com/docs/blueprint-spec

services:
  # Recommended: Static Site (Fast, CDN cached, free)
  - type: web
    name: ok-madam
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_MODE
        value: production
      - key: VITE_CITY
        value: Mathura
